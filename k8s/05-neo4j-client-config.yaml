apiVersion: v1
kind: ConfigMap
metadata:
  namespace: dpsrv
  name: neo4j-client-config
data:
  NEO4J_URI: "bolt://neo4j.dpsrv.svc.cluster.local:7687"
  NEO4J_HTTP_URL: "http://neo4j.dpsrv.svc.cluster.local:7474"

  dotenv: |
    NEO4J_URI=bolt://neo4j.dpsrv.svc.cluster.local:7687
    NEO4J_USERNAME=neo4j
    NEO4J_PASSWORD=changeme
