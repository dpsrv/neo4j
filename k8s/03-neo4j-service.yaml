apiVersion: v1
kind: Service
metadata:
  namespace: dpsrv
  name: neo4j-dev
  labels:
    app: neo4j-dev
spec:
  type: ClusterIP
  selector:
    app: neo4j-dev
  ports:
    - name: http
      port: 7474
      targetPort: 7474
      protocol: TCP
    - name: bolt
      port: 7687
      targetPort: 7687
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  namespace: dpsrv
  name: neo4j-prod
  labels:
    app: neo4j-prod
spec:
  type: ClusterIP
  selector:
    app: neo4j-prod
  ports:
    - name: http
      port: 7474
      targetPort: 7474
      protocol: TCP
    - name: bolt
      port: 7687
      targetPort: 7687
      protocol: TCP
